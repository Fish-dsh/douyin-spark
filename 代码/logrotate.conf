# 部署参考模板：复制到 /etc/logrotate.d/douyin-spark（按实际部署路径修改）
/opt/douyin-spark/runtime/spark.log {
# 实测(板端 2026-10-07): 常规一晚 ~100KB 原文 / ~12KB gzip, 最重的一晚 1MB / 104KB
# → 40 份上限 ≈ 0.5~2MB, 板子 / 盘余 22G。留 7 天时「这个月哪天开始变坏」无从回看
#   (streak_history 只有 30 天的名单计数, 没有诊断细节), 而月度回看正是无人值守要做的第一件事。
    daily
    rotate 40
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
